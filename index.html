#city{position:fixed;left:12px;top:12px;z-index:5;display:flex;gap:6px}
#city a{padding:7px 12px;border-radius:999px;background:rgba(10,12,16,.7);color:#e8eef3;font:700 12px Pretendard,sans-serif;text-decoration:none;border:1px solid rgba(255,255,255,.15)}

#nav .bar #nv-city,#nav .bar #nv-clock{max-width:300px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#nav .turn.arrive{background:#16a35a}

.ar-r{clip-path:polygon(20% 100%,20% 45%,30% 35%,62% 35%,62% 15%,95% 42%,62% 70%,62% 50%,36% 50%,36% 100%)}

.hid{display:none!important}

const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: true});

const pmrem = new THREE.PMREMGenerator(renderer);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));

if (NIGHT) composer.addPass(after);
// light streaks: only bright light sources leave trails (long-exposure look), the rest stays crisp
after.compFsMaterial.fragmentShader = `uniform float damp; uniform sampler2D tOld; uniform sampler2D tNew; varying vec2 vUv;

  uniforms: {tDiffuse: {value: null}, t: {value: 0}, night: {value: NIGHT ? 1 : 0}},
  vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.); }',
